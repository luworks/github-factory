# Include inside the existing chaorders.com server block after routing this prefix here.
location = /github-factory {
    return 308 /github-factory/;
}
location ^~ /github-factory/ {
    proxy_pass http://127.0.0.1:4177;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
}
