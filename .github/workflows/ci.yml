name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOONSHOT_BUDGET_USD: "0"
      MOONSHOT_BASE_PATH: /github-factory/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Verify prefixed production app in Chromium
        shell: bash
        run: |
          HOST=127.0.0.1 PORT=4177 bun run start > /tmp/github-factory.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4177/github-factory/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4177/github-factory/api/health
          bun run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: artifacts/playwright
