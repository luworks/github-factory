services:
  app:
    build:
      context: .
      args:
        MOONSHOT_BASE_PATH: /github-factory/
        SOURCE_SHA: ${SOURCE_SHA:-unknown}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4177
      MOONSHOT_DATA_DIR: /app/.data
    ports:
      - "127.0.0.1:4177:4177"
    volumes:
      - factory-data:/app/.data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "bun", "--eval", "fetch('http://127.0.0.1:4177/github-factory/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  factory-data:
